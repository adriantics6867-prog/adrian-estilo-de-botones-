<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <link rel="stylesheet" href="BOTON.CSS">
    <button class="boton">EFECTO BOTON</button>
    <button class="boton1">EFECTO BOTON</button>
    <button class="boton2">EFECTO BOTON</button>
<style>
.boton {
    background: #5c4fd3;
    transition: background .3s ease, transform .6s ease;
}
.boton1 {
    background: #c0f013;
    transition: background .3s ease, transform .6s ease;
}
.boton2 {
    background: #0cc2fa;
    transition: background .3s ease, transform .6s ease;
}
.boton:hover {
    background: #b10909;
    transform: translateY(-5px);
    box-shadow: 0 6px 14px  rgba(93, 4, 248, 0.35);
}
.boton1:hover {
    background: #0faf0a;
    transform: translateY(-5px);
    box-shadow: 0 6px 14px  rgba(4, 138, 248, 0.35);
}
.boton2:hover {
    background: #fa1ed5;
    transform: translateY(-5px);
    box-shadow: 0 6px 14px  rgba(248, 4, 195, 0.35);
}
</style>
</body>
</html>
